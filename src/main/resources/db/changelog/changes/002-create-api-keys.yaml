databaseChangeLog:
  - changeSet:
      id: 002-create-api-keys
      author: artur
      changes:
        - createTable:
            tableName: api_keys
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: prefix
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: key_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: api_keys
            baseColumnNames: application_id
            referencedTableName: applications
            referencedColumnNames: id
            constraintName: fk_api_keys_application
            onDelete: CASCADE

        - createIndex:
            tableName: api_keys
            indexName: idx_api_keys_application_id
            columns:
              - column:
                  name: application_id