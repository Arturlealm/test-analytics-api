databaseChangeLog:
  - changeSet:
      id: 006-create-dashboard-users
      author: artur
      changes:
        - createTable:
            tableName: dashboard_users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - insert:
            tableName: dashboard_users
            columns:
              - column:
                  name: id
                  value: "01a0880c-a02f-7455-a107-799d5fc9eba0"

              - column:
                  name: email
                  value: "admin@analytics.local"

              - column:
                  name: password_hash
                  value: "$2y$12$OY40JtnZuAcITTZD1If1uO7ZMN0VKgiuXTIWNdSgbEexsU6YndQiG"

              - column:
                  name: role
                  value: "ADMIN"

              - column:
                  name: created_at
                  valueComputed: "CURRENT_TIMESTAMP"