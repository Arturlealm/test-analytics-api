databaseChangeLog:
  - changeSet:
      id: 005-create-ai-usages
      author: artur

      changes:
        - createTable:
            tableName: ai_usages
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: application_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ai_usages_application
                    references: applications(id)

              - column:
                  name: end_user_id
                  type: UUID
                  constraints:
                    nullable: true
                    foreignKeyName: fk_ai_usages_end_user
                    references: end_users(id)

              - column:
                  name: provider
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: model
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: tokens
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: cost
                  type: DECIMAL(19,6)
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: ai_usages
            indexName: idx_ai_usages_application_id
            columns:
              - column:
                  name: application_id

        - createIndex:
            tableName: ai_usages
            indexName: idx_ai_usages_end_user_id
            columns:
              - column:
                  name: end_user_id

        - createIndex:
            tableName: ai_usages
            indexName: idx_ai_usages_occurred_at
            columns:
              - column:
                  name: occurred_at