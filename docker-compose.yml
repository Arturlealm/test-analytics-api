services:
  postgres:
    image: postgres:18
    container_name: analytics-postgres

    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: analytics-api

    depends_on:
      - postgres

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/analytics
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret-change-this-secret
      JWT_EXPIRATION: 3600

    ports:
      - "8080:8080"

volumes:
  postgres_data: